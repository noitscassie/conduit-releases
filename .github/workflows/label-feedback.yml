name: Label feedback from Conduit

# Conduit files reports as whoever sent them, and GitHub drops labels set by
# anyone without triage access, so the app marks each issue's kind in a
# comment and this applies the label.
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    if: contains(github.event.issue.body, '<!-- conduit-feedback:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const match = body.match(/<!-- conduit-feedback: (bug|enhancement|feedback) -->/);
            if (!match) return;
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.issue.number,
              labels: [match[1]],
            });
